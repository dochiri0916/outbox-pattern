global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: polling-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - polling-worker
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104
