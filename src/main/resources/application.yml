spring:
  docker:
    compose:
      enabled: true
      file: compose.yml
      lifecycle-management: start-and-stop

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: ${app.time-zone}
        show_sql: true
        format_sql: true
        highlight_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  time-zone: UTC
  staging:
    dir: /tmp/outbox-staging

aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: local-test-bucket

outbox:
  worker:
    batch-size: 10
    max-retry-count: 5
    processing-timeout: 5m
    polling-delay: 30s
    recovery-delay: 30s
