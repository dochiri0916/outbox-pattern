spring:
  datasource:
    url: jdbc:h2:mem:cdc-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

outbox:
  cdc:
    kafka:
      bootstrap-servers: localhost:9092

app:
  staging:
    dir: /tmp/outbox-cdc-test

aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: local-test-bucket
