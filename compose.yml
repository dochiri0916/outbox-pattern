services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: outbox_pattern
      MYSQL_USER: outbox
      MYSQL_PASSWORD: outbox
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "outbox", "-poutbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro"
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  localstack-data:
