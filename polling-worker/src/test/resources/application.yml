spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      jakarta.persistence.lock.timeout: 1000
      hibernate:
        jdbc:
          time_zone: ${app.time-zone}
        show_sql: true
        format_sql: true
        highlight_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  time-zone: UTC

aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: local-test-bucket
    api-call-timeout: 2m

outbox:
  worker:
    batch-size: 10
    max-retry-count: 3
    processing-timeout: 5m
    polling-delay: 30s
    recovery-delay: 30s
    retry-backoff-base: 10s
    retry-backoff-max: 5m
    retry-jitter-ratio: 0.5
    multipart-part-size-bytes: 5242880
    claim-strategy: skip-locked
